<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paid Finance Consultancy</title>
    <!-- Tailwind CSS CDN -->
    <link rel="icon" href="/image/BGSA_logo.ico" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/style.css">
</head>

<body class="bg-gray-50">

    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <a href="/index.html" id="logoLink" class="flex items-center">
                    <img src="/image/BGSA Logo.jpeg" class="h-12 w-auto object-contain" alt="Logo">
                </a>

                <div id="desktopNavLinks" class="hidden md:flex items-center gap-8 font-medium text-gray-700">
                    <a href="/index.html"
                        class="hover:text-yellow-500 transition-colors py-1 border-b-2 border-transparent">Home</a>
                    <a href="/about.html"
                        class="hover:text-yellow-500 transition-colors py-1 border-b-2 border-transparent">About</a>

                    <button id="servicesBtn"
                        class="flex items-center gap-2 hover:text-yellow-500 focus:outline-none transition-colors py-1">
                        Services
                        <svg id="servicesArrow" xmlns="http://www.w3.org/2000/svg"
                            class="w-4 h-4 transition-transform duration-300" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                    <a href="/industries.html"
                        class="hover:text-yellow-500 transition-colors py-1 border-b-2 border-transparent">Industries</a>
                    <a href="/projects.html"
                        class="hover:text-yellow-500 transition-colors py-1 border-b-2 border-transparent">Projects</a>
                    <a href="/globalBusiness.html"
                        class="hover:text-yellow-500 transition-colors py-1 border-b-2 border-transparent">Global
                        Business</a>
                    <a href="/contact.html"
                        class="hover:text-yellow-500 transition-colors py-1 border-b-2 border-transparent">Contact</a>
                </div>

                <div class="flex items-center gap-4 md:hidden">
                    <button id="mobileMenuBtn" class="text-gray-700 hover:text-yellow-500 focus:outline-none p-1">
                        <svg id="mobileMenuIcon" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobileMenu"
            class="hidden md:hidden bg-white border-t border-gray-100 shadow-inner max-h-[calc(100vh-80px)] overflow-y-auto subtle-scroll">
            <div id="mobileNavLinks" class="px-6 py-4 flex flex-col gap-4 font-medium text-gray-700">
                <a href="/index.html" class="hover:text-yellow-500 py-2 px-3 rounded-md transition-colors">Home</a>
                <a href="/about.html" class="hover:text-yellow-500 py-2 px-3 rounded-md transition-colors">About</a>

                <div id="mobileServicesContainer" class="w-full"></div>

                <a href="/industries.html"
                    class="hover:text-yellow-500 py-2 px-3 rounded-md transition-colors">Industries</a>
                <a href="/projects.html"
                    class="hover:text-yellow-500 py-2 px-3 rounded-md transition-colors">Projects</a>
                <a href="/globalBusiness.html"
                    class="hover:text-yellow-500 py-2 px-3 rounded-md transition-colors">Global Business</a>
                <a href="/contact.html" class="hover:text-yellow-500 py-2 px-3 rounded-md transition-colors">Contact</a>
            </div>
        </div>

        <div id="megaMenu"
            class="hidden fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[90vw] max-w-6xl bg-[#0B192C] text-white rounded-2xl shadow-[0_0_0_100vw_rgba(0,0,0,0.6),0_25px_50px_-12px_rgba(0,0,0,0.7)] z-[100] transition-all duration-300 max-h-[85vh] overflow-y-auto subtle-scroll border border-gray-800">

            <div class="px-6 py-8 md:px-10">
                <div class="border-b border-gray-700 pb-4 mb-6 flex justify-between items-end">
                    <h2 class="text-2xl font-semibold text-white tracking-wide">Our <span
                            class="text-yellow-500">Services</span>
                    </h2>
                    <span class="text-xs text-gray-400 hidden sm:block">Hover to explore categories</span>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 md:gap-12">
                    <div id="mainMenu" class="flex flex-col gap-2"></div>
                    <div id="categoryMenu" class="flex flex-col gap-2 border-l border-gray-700 pl-4 md:pl-6 hidden">
                    </div>
                    <div id="linksMenu" class="flex flex-col gap-2 border-l border-gray-700 pl-4 md:pl-6 hidden"></div>
                </div>
            </div>

        </div>

    <footer class="bg-gradient-to-b from-[#0B192C] via-[#0B192C] to-[#1E3A8A] text-white">
        <div class="bg-[#F59E0B] h-[1px]"></div>
        <section class="py-10">
            <div class="container mx-auto px-4">
                <div class="max-w-6xl mx-auto">
                    <!-- 1. Fixed the 'flex-wrap' typo and balanced gap properties -->
                    <div class="flex flex-wrap w-full gap-y-8 md:gap-x-4 lg:gap-x-8">
                        <div class="w-full md:w-[45%] lg:w-[22%] flex flex-col justify-start">
                            <div>
                                <h1
                                    class="text-[#F59E0B] text-xl font-bold border-b border-slate-700/50 pb-2 md:border-none md:pb-0">
                                    Quick Links</h1>
                                <div class="w-full pt-4 md:pt-5">
                                    <div id="quick-links-container" class="space-y-3">
                                        <!-- Dynamic quick links will be injected here -->
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="w-full md:w-full lg:w-[50%] flex flex-col justify-start md:order-3 lg:order-2">
                            <h1
                                class="text-[#F59E0B] text-xl font-bold border-b border-slate-700/50 pb-2 md:border-none md:pb-0">
                                Services</h1>
                            <!-- FIXED INSUFFICIENT WIDTH: Removed 'w-1/2' constraint and replaced it with an adaptive full-width flex framework -->
                            <div class="flex flex-col sm:flex-row w-full gap-x-6 gap-y-4 pt-4 md:pt-5">
                                <div class="w-full sm:w-1/2">
                                    <div id="first-tree-root-container" class="space-y-3">
                                        <!-- Dynamic links injected here -->
                                    </div>
                                </div>
                                <div class="w-full sm:w-1/2">
                                    <div id="second-tree-root-container" class="space-y-3">
                                        <!-- Dynamic links injected here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="w-full md:w-[45%] lg:w-[22%] flex flex-col justify-start md:order-2 lg:order-3">
                            <div>
                                <h1
                                    class="text-[#F59E0B] text-xl font-bold border-b border-slate-700/50 pb-2 md:border-none md:pb-0">
                                    Government Schemes</h1>
                                <div class="w-full pt-4 md:pt-5">
                                    <div id="government-schemes-container" class="space-y-3">
                                        <!-- Dynamic links will render here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="text-center text-sm">
            <hr class="bg-black h-[1px]">
            <div class="grid grid-cols-1 justify-items-center py-4">
                <div class="grid grid-flow-col gap-4 md:gap-10 text-2xl">
                    <a id="link-facebook" target="_blank" rel="noopener noreferrer">
                        <div
                            class="grid items-center justify-center w-12 h-12 rounded-full border border-[#f1f1f1] text-[#f1f1f1] hover:text-[#0F5FDC]">
                            <i class="fa-brands fa-facebook text-2xl"></i>
                        </div>
                    </a>
                    <a id="link-twitter" target="_blank" rel="noopener noreferrer">
                        <div
                            class="grid items-center justify-center w-12 h-12 rounded-full border border-[#f1f1f1] text-[#f1f1f1] hover:text-[#0F5FDC]">
                            <i class="fa-brands fa-x-twitter text-xl"></i>
                        </div>
                    </a>
                    <a id="link-linkedin" target="_blank" rel="noopener noreferrer">
                        <div
                            class="grid items-center justify-center w-12 h-12 rounded-full border border-[#f1f1f1] text-[#f1f1f1] hover:text-[#0F5FDC]">
                            <i class="fa-brands fa-linkedin text-xl"></i>
                        </div>
                    </a>
                    <a id="link-youtube" target="_blank" rel="noopener noreferrer">
                        <div
                            class="grid items-center justify-center w-12 h-12 rounded-full border border-[#f1f1f1] text-[#f1f1f1] hover:text-[#0F5FDC]">
                            <i class="fa-brands fa-youtube text-xl"></i>
                        </div>
                    </a>
                    <a id="link-threads" target="_blank" rel="noopener noreferrer">
                        <div
                            class="grid items-center justify-center w-12 h-12 rounded-full border border-[#f1f1f1] text-[#f1f1f1] hover:text-[#0F5FDC]">
                            <i class="fa-brands fa-threads text-xl"></i>
                        </div>
                    </a>
                </div>
            </div>
            <p class="md:text-lg pb-4">© 2026 Powerd by Vertexcel Export India Pvt Ltd</p>
        </section>
    </footer>
    
    
    
    <script src="/headerFooter.js"></script>
    
    <div class="fixed bottom-5 right-5 group z-50">
        <a href="https://wa.me/919811033633" target="_blank" class="text-[#4ACA5B]">
            <i class="fa-brands fa-square-whatsapp text-6xl"></i>
        </a>

        <!-- Tooltip -->
        <span
            class="absolute right-[66px] top-2/3 -translate-y-1/2 bg-[#4ACA5B] text-white text-sm px-3 py-0.5 rounded-3xl opacity-0 group-hover:opacity-100 transition duration-300 whitespace-nowrap pointer-events-none">
            WhatsApp Us
        </span>
    </div>

    <!-- Script connection link -->
    <script src="/menu.js"></script>
